<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff" />
      <stop offset="100%" stop-color="#e2eefe" />
    </linearGradient>
    <linearGradient id="nsBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#nsBg)" />

  <!-- Navbar -->
  <rect x="50" y="35" width="700" height="42" rx="10" fill="#ffffff" stroke="#cde3fc" stroke-width="1" />
  <circle cx="75" cy="56" r="6" fill="#0284c7" />
  <text x="92" y="61" fill="#0c4a6e" font-family="system-ui, sans-serif" font-weight="800" font-size="15" letter-spacing="0.5">NuScreen</text>
  <text x="320" y="60" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Camp Operations</text>
  <text x="440" y="60" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="500">CSR Analytics</text>
  <text x="545" y="60" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Public Health</text>
  <rect x="635" y="44" width="95" height="24" rx="12" fill="url(#nsBlue)" />
  <text x="682" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="10.5" text-anchor="middle">Portal Login</text>

  <!-- Left Main Content -->
  <g transform="translate(60, 110)">
    <rect width="130" height="22" rx="11" fill="#0284c7" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1" />
    <text x="65" y="15" fill="#0369a1" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">PUBLIC HEALTH PLATFORM</text>

    <text x="0" y="60" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">Smarter Screening</text>
    <text x="0" y="96" fill="#0284c7" font-family="system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">Healthier Communities</text>

    <text x="0" y="135" fill="#475569" font-family="system-ui, sans-serif" font-size="13">
      End-to-end digital coordination for mobile health screening camps,
    </text>
    <text x="0" y="155" fill="#475569" font-family="system-ui, sans-serif" font-size="13">
      beneficiary tracking, risk triage, and CSR impact analytics.
    </text>

    <!-- Stat Pills Row -->
    <g transform="translate(0, 185)">
      <rect width="125" height="55" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
      <text x="15" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">CAMPS HOSTED</text>
      <text x="15" y="45" fill="#0284c7" font-family="system-ui, sans-serif" font-weight="800" font-size="20">150+</text>

      <g transform="translate(140, 0)">
        <rect width="125" height="55" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
        <text x="15" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">BENEFICIARIES</text>
        <text x="15" y="45" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="800" font-size="20">24,500+</text>
      </g>
    </g>

    <g transform="translate(0, 265)">
      <rect width="145" height="38" rx="10" fill="url(#nsBlue)" />
      <text x="72" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Request Camp ↗</text>
    </g>
  </g>

  <!-- Right Floating Dashboard Card -->
  <g transform="translate(480, 110)">
    <rect width="260" height="340" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" />
    <rect x="15" y="15" width="230" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="28" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Live Screening Activity</text>
    <circle cx="230" cy="31" r="4" fill="#10b981" />

    <!-- Metric Bar 1 -->
    <g transform="translate(15, 65)">
      <text x="0" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Diabetes Triage</text>
      <text x="230" y="12" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="end">84% Screened</text>
      <rect y="18" width="230" height="6" rx="3" fill="#e2e8f0" />
      <rect y="18" width="193" height="6" rx="3" fill="#0284c7" />
    </g>

    <!-- Metric Bar 2 -->
    <g transform="translate(15, 110)">
      <text x="0" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Hypertension Alert Rate</text>
      <text x="230" y="12" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="end">12.3% Critical</text>
      <rect y="18" width="230" height="6" rx="3" fill="#e2e8f0" />
      <rect y="18" width="60" height="6" rx="3" fill="#ef4444" />
    </g>

    <!-- Recent Beneficiary Records -->
    <g transform="translate(15, 160)">
      <text x="0" y="14" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="700" font-size="11.5">Recent Registrations</text>

      <rect y="24" width="230" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="43" r="10" fill="#e0f2fe" />
      <text x="20" y="47" fill="#0369a1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">👤</text>
      <text x="38" y="39" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Venkat Rao (48)</text>
      <text x="38" y="52" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">Normal Vitals • Camp #42</text>
      <text x="215" y="46" fill="#10b981" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="end">PASS</text>

      <g transform="translate(0, 44)">
        <rect y="24" width="230" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <circle cx="20" cy="43" r="10" fill="#fee2e2" />
        <text x="20" y="47" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">⚠️</text>
        <text x="38" y="39" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Lakshmi Devi (54)</text>
        <text x="38" y="52" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">High BP Flag • Referred</text>
        <text x="215" y="46" fill="#ef4444" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="end">ALERT</text>
      </g>
    </g>
  </g>
</svg>
