<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fee7" />
      <stop offset="100%" stop-color="#ecfccb" />
    </linearGradient>
    <linearGradient id="gdGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#gdBg)" />

  <!-- Navbar -->
  <rect x="50" y="35" width="700" height="42" rx="10" fill="#ffffff" stroke="#d9f99d" stroke-width="1" />
  <circle cx="75" cy="56" r="6" fill="#16a34a" />
  <text x="92" y="61" fill="#14532d" font-family="system-ui, sans-serif" font-weight="800" font-size="15">Mill2Meal</text>
  <text x="320" y="60" fill="#3f6212" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Grains &amp; Pulses</text>
  <text x="430" y="60" fill="#3f6212" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Cold Pressed Oils</text>
  <text x="560" y="60" fill="#3f6212" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Subscriptions</text>
  <rect x="660" y="44" width="70" height="24" rx="12" fill="url(#gdGreen)" />
  <text x="695" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="10.5" text-anchor="middle">Cart (2)</text>

  <!-- Left Main Content -->
  <g transform="translate(60, 110)">
    <rect width="145" height="22" rx="11" fill="#16a34a" fill-opacity="0.15" stroke="#4ade80" stroke-width="1" />
    <text x="72" y="15" fill="#15803d" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">FARM TO TABLE FRESHNESS</text>

    <text x="0" y="62" fill="#14532d" font-family="system-ui, sans-serif" font-weight="800" font-size="32" letter-spacing="-0.5">Fresh Groceries</text>
    <text x="0" y="100" fill="#15803d" font-family="system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">Delivered to Your Doorstep</text>

    <text x="0" y="140" fill="#4d7c0f" font-family="system-ui, sans-serif" font-size="13">
      100% unpolished grains, stone-ground flours, and pure wood-pressed oils.
    </text>
    <text x="0" y="160" fill="#4d7c0f" font-family="system-ui, sans-serif" font-size="13">
      Delivered fresh from local traditional mills with subscription flexibility.
    </text>

    <!-- Search/Pincode Bar -->
    <g transform="translate(0, 195)">
      <rect width="360" height="44" rx="10" fill="#ffffff" stroke="#bef264" stroke-width="1.5" />
      <text x="15" y="27" fill="#65a30d" font-family="system-ui, sans-serif" font-size="12">📍 Enter pincode for delivery status...</text>
      <rect x="260" y="6" width="92" height="32" rx="8" fill="url(#gdGreen)" />
      <text x="306" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Check</text>
    </g>

    <!-- Badges -->
    <g transform="translate(0, 260)">
      <circle cx="10" cy="10" r="10" fill="#dcfce7" />
      <text x="10" y="14" fill="#15803d" font-size="11" text-anchor="middle">✓</text>
      <text x="28" y="14" fill="#14532d" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Zero Preservatives</text>

      <g transform="translate(170, 0)">
        <circle cx="10" cy="10" r="10" fill="#dcfce7" />
        <text x="10" y="14" fill="#15803d" font-size="11" text-anchor="middle">✓</text>
        <text x="28" y="14" fill="#14532d" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Same-Day Milling</text>
      </g>
    </g>
  </g>

  <!-- Right Floating Product Mockup -->
  <g transform="translate(480, 110)">
    <rect width="260" height="340" rx="16" fill="#ffffff" stroke="#d9f99d" stroke-width="1.5" />
    
    <!-- Grocery Bag / Items Visual -->
    <rect x="20" y="20" width="220" height="180" rx="12" fill="#f7fee7" />
    <circle cx="130" cy="100" r="50" fill="#bef264" fill-opacity="0.5" />
    <text x="130" y="115" font-size="54" text-anchor="middle">🌾</text>
    <rect x="35" y="160" width="80" height="24" rx="12" fill="#15803d" />
    <text x="75" y="176" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">BESTSELLER</text>

    <!-- Product Info -->
    <text x="20" y="225" fill="#14532d" font-family="system-ui, sans-serif" font-weight="800" font-size="16">Organic Bansi Wheat</text>
    <text x="20" y="244" fill="#65a30d" font-family="system-ui, sans-serif" font-size="12">Stone Ground • 5 kg Pack</text>
    
    <text x="20" y="280" fill="#15803d" font-family="system-ui, sans-serif" font-weight="800" font-size="20">₹349</text>
    <text x="75" y="280" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="13" text-decoration="line-through">₹420</text>
    
    <rect x="140" y="258" width="100" height="34" rx="8" fill="url(#gdGreen)" />
    <text x="190" y="279" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">+ Add to Cart</text>

    <text x="130" y="322" fill="#4d7c0f" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">⚡ Delivered in 24 hrs across 120+ pincodes</text>
  </g>
</svg>
