<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#141417" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8f542" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <filter id="neonLime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#pfBg)" />
  <circle cx="650" cy="220" r="130" fill="#c8f542" opacity="0.12" filter="url(#neonLime)" />

  <!-- Navbar -->
  <rect x="50" y="35" width="700" height="42" rx="10" fill="#141417" stroke="#27272a" stroke-width="1" />
  <text x="75" y="61" fill="#f3f1ec" font-family="system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="1">KONASANI TEJA</text>
  <circle cx="185" cy="56" r="3.5" fill="#c8f542" />
  <text x="440" y="60" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Work</text>
  <text x="495" y="60" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Stack</text>
  <text x="555" y="60" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Experience</text>
  <rect x="645" y="44" width="85" height="24" rx="12" fill="url(#limeGrad)" />
  <text x="687" y="60" fill="#0c0c0e" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" text-anchor="middle">Contact</text>

  <!-- Left Hero Typography -->
  <g transform="translate(60, 110)">
    <rect width="210" height="22" rx="11" fill="#1b1b20" stroke="#27272a" stroke-width="1" />
    <circle cx="15" cy="11" r="3.5" fill="#c8f542" />
    <text x="28" y="15" fill="#c8f542" font-family="monospace" font-size="9.5" font-weight="600">AI ENGINEER • BUILDING SYSTEMS</text>

    <text x="0" y="68" fill="#f3f1ec" font-family="system-ui, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">TEJA</text>
    <text x="125" y="68" fill="#ff6a3d" font-family="Georgia, serif" font-style="italic" font-weight="400" font-size="44">builds</text>
    <text x="245" y="68" fill="#f3f1ec" font-family="system-ui, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">THINGS</text>

    <text x="0" y="115" fill="#f3f1ec" font-family="system-ui, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">THAT THINK.</text>

    <text x="0" y="156" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">
      I engineer production-grade AI applications, full-stack platforms,
    </text>
    <text x="0" y="176" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">
      and scalable backend systems that transform complex ideas into products.
    </text>

    <g transform="translate(0, 210)">
      <rect width="145" height="38" rx="19" fill="url(#limeGrad)" />
      <text x="72" y="24" fill="#0c0c0e" font-family="monospace" font-weight="700" font-size="12" text-anchor="middle">Explore My Work →</text>

      <rect x="160" y="0" width="100" height="38" rx="19" fill="#1b1b20" stroke="#27272a" stroke-width="1" />
      <text x="210" y="24" fill="#f3f1ec" font-family="monospace" font-weight="600" font-size="12" text-anchor="middle">Resume ↗</text>
    </g>
  </g>

  <!-- Right Torus Wireframe Graphic -->
  <g transform="translate(580, 260)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#c8f542" stroke-width="1.5" stroke-opacity="0.3" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ff6a3d" stroke-width="1.2" stroke-opacity="0.4" />
    <!-- 3D Knot rings -->
    <ellipse cx="0" cy="0" rx="90" ry="40" fill="none" stroke="#c8f542" stroke-width="2" transform="rotate(35)" stroke-opacity="0.8" />
    <ellipse cx="0" cy="0" rx="90" ry="40" fill="none" stroke="#c8f542" stroke-width="2" transform="rotate(-35)" stroke-opacity="0.8" />
    <ellipse cx="0" cy="0" rx="90" ry="25" fill="none" stroke="#ffffff" stroke-width="1.5" transform="rotate(75)" stroke-opacity="0.5" />
    <circle cx="0" cy="0" r="12" fill="#c8f542" fill-opacity="0.2" />
    <circle cx="0" cy="0" r="5" fill="#c8f542" />

    <!-- Circular Badge text -->
    <text x="75" y="-75" fill="#c8f542" font-family="monospace" font-size="9" letter-spacing="1">✦ IDEAS TO AGENTS</text>
  </g>
</svg>
